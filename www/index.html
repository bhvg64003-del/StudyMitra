<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyMitra</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="brand">Study<span>Mitra</span></div>
        <p>Your learning companion</p>
      </div>
      <button class="profile-btn">👤</button>
    </header>

    <main>
      <section class="welcome">
        <p class="small">WELCOME BACK 👋</p>
        <h1>Ready to learn<br>something new?</h1>
      </section>

      <section class="search-box">
        <span>🔍</span>
        <input type="text" placeholder="Search courses, videos, notes...">
      </section>

      <h2>Quick Access</h2>

      <section class="quick-grid">
        <button class="quick-card physics">
          <span>⚡</span>
          <strong>Physics</strong>
          <small>Learn concepts</small>
        </button>

        <button class="quick-card chemistry">
          <span>🧪</span>
          <strong>Chemistry</strong>
          <small>Master reactions</small>
        </button>

        <button class="quick-card maths">
          <span>📐</span>
          <strong>Mathematics</strong>
          <small>Practice problems</small>
        </button>

        <button class="quick-card notes">
          <span>📚</span>
          <strong>Class Notes</strong>
          <small>Revise anytime</small>
        </button>
      </section>

      <section class="continue-card">
        <div>
          <p>CONTINUE WATCHING</p>
          <h3>Your lectures will appear here</h3>
          <span>Resume from where you stopped</span>
        </div>
        <button>▶️</button>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="active">⌂<span>Home</span></button>
      <button>▣<span>Courses</span></button>
      <button>▶️<span>Videos</span></button>
      <button>📝<span>Tests</span></button>
      <button>👤<span>Profile</span></button>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
